name: southcity

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-14333}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # One-shot provisioner: recreates the database from the unmodified schema.sql fixture and
  # creates the least-privilege runtime logins. Re-run it to reset: `docker compose run --rm db-init`.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-SouthCity}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:?set SALES_DB_PASSWORD in .env}
      MGMT_DB_PASSWORD: ${MGMT_DB_PASSWORD:?set MGMT_DB_PASSWORD in .env}
    volumes:
      - ./schema.sql:/fixture/schema.sql:ro
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash", "/sql/init.sh"]
    restart: "no"

  api:
    build: .
    profiles: ["api"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "1433"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
